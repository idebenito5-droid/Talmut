<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1F3A">
<title>TALMUT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0B1F3A;--navy-light:#0E2545;--navy-dark:#071428;--gold:#B8860B;--gold-dim:rgba(184,134,11,0.4);--green:#6BBF7A;--blue:#64A0DC;--red:rgba(220,80,80,0.7);--burgundy:rgb(160,55,65);--cream:#E8DCC8;--text:rgba(255,255,255,0.85);--text-dim:rgba(255,255,255,0.5);--text-dimmer:rgba(255,255,255,0.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--navy);color:var(--text);min-height:100dvh;overflow-x:hidden}
.screen{display:none;flex-direction:column;min-height:100dvh;padding-bottom:72px}
.screen.active{display:flex}
.screen.no-nav{padding-bottom:0}

/* Header */
.header{display:flex;align-items:center;padding:52px 16px 12px;gap:10px;position:sticky;top:0;background:var(--navy);z-index:10}
.header h1{flex:1;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:var(--cream);letter-spacing:2px}
.header .subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;color:var(--text-dim);text-align:center;margin-top:2px}
.btn-back{width:36px;height:36px;border:none;background:rgba(255,255,255,0.05);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-back svg{width:8px;height:14px}
.spacer{width:36px;flex-shrink:0}

/* Buttons */
.btn{border:none;border-radius:12px;padding:14px 24px;font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:2px;cursor:pointer;transition:all .2s;text-align:center;width:100%}
.btn-gold{background:linear-gradient(135deg,#B8860B,#DAA520);color:#1a0a00;box-shadow:0 4px 20px rgba(184,134,11,0.3)}
.btn-gold:active{transform:scale(0.97)}
.btn-blue{background:linear-gradient(135deg,#4A90D9,#64A0DC);color:#fff;box-shadow:0 4px 20px rgba(100,160,220,0.3)}
.btn-blue:active{transform:scale(0.97)}
.btn-burgundy{background:linear-gradient(135deg,rgb(140,45,55),rgb(160,55,65));color:#fff;box-shadow:0 4px 20px rgba(160,55,65,0.3)}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.15);color:var(--text-dim);font-family:'Inter',sans-serif;font-weight:500;font-size:12px;letter-spacing:1px}
.btn-sm{padding:10px 16px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:0.3;cursor:not-allowed}
.btn-danger{background:rgba(220,60,60,0.15);border:1px solid rgba(220,60,60,0.3);color:rgba(220,80,80,0.8);font-family:'Inter',sans-serif;font-weight:500;font-size:12px}

/* Bottom Nav */
.nav-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(7,20,40,0.95);border-top:1px solid rgba(255,255,255,0.06);padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:100;backdrop-filter:blur(12px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;cursor:pointer;border:none;background:none;color:var(--text-dimmer);font-family:'Inter',sans-serif;font-size:9px;font-weight:500;letter-spacing:0.5px;transition:color .2s}
.nav-item.active{color:var(--gold)}
.nav-item svg{width:22px;height:22px;opacity:0.5;transition:opacity .2s}
.nav-item.active svg{opacity:1}

/* Menu */
.menu-logo{width:80px;height:80px;margin:0 auto 8px}
.menu-title{font-family:'Cinzel',serif;font-weight:900;font-size:28px;color:var(--cream);letter-spacing:6px;text-align:center}
.menu-subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--gold-dim);text-align:center;margin-top:4px;letter-spacing:1.5px}
.menu-buttons{display:flex;flex-direction:column;gap:12px;padding:0 32px;margin-top:32px}
.menu-divider{display:flex;align-items:center;gap:12px;padding:24px 32px}
.menu-divider span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;color:var(--text-dimmer);letter-spacing:1px}
.menu-divider::before,.menu-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06)}

/* Player Selection */
.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.player-card{background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px 16px;text-align:center;cursor:pointer;transition:all .2s}
.player-card.selected{border-color:var(--gold);background:rgba(184,134,11,0.08)}
.player-card.selected-blue{border-color:var(--blue);background:rgba(100,160,220,0.08)}
.player-card .name{font-family:'Cinzel',serif;font-weight:600;font-size:14px;color:var(--cream);letter-spacing:1px}
.player-card .check{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.player-card.selected .check,.player-card.selected-blue .check{border-color:var(--gold);background:var(--gold)}
.player-card.selected-blue .check{border-color:var(--blue);background:var(--blue)}

/* Score Table */
.round-info{text-align:center;padding:8px 16px;font-family:'Inter',sans-serif;font-size:12px;color:var(--text-dim)}
.score-wrapper{flex:1;overflow-x:auto;padding:0 8px}
.score-table{width:100%;border-collapse:collapse;min-width:320px}
.score-table th{font-family:'Inter',sans-serif;font-weight:600;font-size:10px;color:var(--text-dim);letter-spacing:0.5px;padding:8px 4px;text-align:center;position:sticky;top:0;background:var(--navy);text-transform:uppercase}
.score-table th:first-child{text-align:left;padding-left:8px;width:36px}
.score-table td{padding:3px 2px;text-align:center;border-top:1px solid rgba(255,255,255,0.04)}
.score-table td:first-child{text-align:left;padding-left:8px;font-size:11px;color:var(--text-dimmer);font-weight:500}
.score-cell{width:100%;padding:8px 4px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;text-align:center;cursor:pointer;min-height:34px;display:flex;align-items:center;justify-content:center}
.score-cell.empty{color:var(--text-dimmer);font-weight:400;font-size:11px}
.score-cell.winner{color:var(--green);background:rgba(107,191,122,0.06)}
.score-cell.zero{color:var(--green)}
.score-cell.negative{color:var(--green)}
.score-cell.high{color:var(--red)}
.total-row td{border-top:2px solid rgba(255,255,255,0.1);font-family:'Inter',sans-serif;font-weight:700;font-size:14px;padding:10px 4px}
.total-row .label{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:1px}
.score-actions{padding:12px 16px;display:flex;gap:8px}

/* Score Input Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:var(--navy-light);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:20px;width:280px;text-align:center}
.modal h3{font-family:'Cinzel',serif;font-size:14px;color:var(--cream);margin-bottom:4px}
.modal .modal-sub{font-size:11px;color:var(--text-dim);margin-bottom:16px}
.modal input[type=number]{width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:24px;font-weight:700;text-align:center;outline:none}
.modal input:focus{border-color:var(--gold)}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.modal-btns .btn{flex:1}

/* Winner */
.winner-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;flex:1}
.winner-crown{font-size:48px;margin-bottom:8px}
.winner-name{font-family:'Cinzel',serif;font-weight:900;font-size:32px;color:var(--gold);letter-spacing:4px;margin-bottom:4px}
.winner-score{font-family:'Inter',sans-serif;font-size:14px;color:var(--text-dim)}
.standings{width:100%;margin-top:24px;display:flex;flex-direction:column;gap:6px}
.standing-row{display:flex;align-items:center;padding:10px 14px;background:rgba(255,255,255,0.03);border-radius:10px;gap:10px}
.standing-pos{font-family:'Inter',sans-serif;font-weight:700;font-size:13px;color:var(--text-dimmer);width:24px}
.standing-name{flex:1;font-family:'Cinzel',serif;font-weight:500;font-size:13px;color:var(--cream);text-align:left}
.standing-pts{font-family:'Inter',sans-serif;font-weight:700;font-size:14px}

/* Histórico */
.historico-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.summary-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px;text-align:center}
.summary-card .value{font-family:'Inter',sans-serif;font-weight:800;font-size:24px;color:var(--gold)}
.summary-card .label{font-family:'Inter',sans-serif;font-size:10px;color:var(--text-dimmer);letter-spacing:0.5px;margin-top:2px}
.match-list{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.match-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px;cursor:pointer;transition:background .2s}
.match-item:active{background:rgba(255,255,255,0.06)}
.match-item .match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.match-item .match-type{font-family:'Inter',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.5px;padding:3px 8px;border-radius:4px}
.match-item .match-type.talmut{background:rgba(184,134,11,0.15);color:var(--gold)}
.match-item .match-type.blue_lagoon{background:rgba(100,160,220,0.15);color:var(--blue)}
.match-item .match-date{font-family:'Inter',sans-serif;font-size:10px;color:var(--text-dimmer)}
.match-item .match-winner{font-family:'Cinzel',serif;font-size:13px;color:var(--cream);margin-top:2px}
.match-item .match-players{font-family:'Inter',sans-serif;font-size:10px;color:var(--text-dimmer);margin-top:4px}

/* Hall of Fame */
.hall-sort{display:flex;gap:6px;padding:8px 16px}
.sort-btn{padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:all .2s}
.sort-btn.active{background:rgba(100,160,220,0.15);border-color:var(--blue);color:var(--blue)}
.hall-table{width:100%;border-collapse:collapse;margin:0}
.hall-table th{font-family:'Inter',sans-serif;font-weight:600;font-size:9px;color:var(--text-dimmer);letter-spacing:0.5px;padding:10px 4px;text-align:center;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;background:var(--navy)}
.hall-table th:first-child{text-align:left;padding-left:16px}
.hall-table td{padding:10px 4px;text-align:center;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--text-dim);border-bottom:1px solid rgba(255,255,255,0.03)}
.hall-table td:first-child{text-align:left;padding-left:16px;font-family:'Cinzel',serif;font-weight:500;font-size:12px;color:var(--cream)}
.hall-table tr:first-child td{color:var(--text)}
.hall-table .highlight{color:var(--gold);font-weight:700}

/* La Maltesa */
.maltesa-content{flex:1;padding:0 16px 24px;overflow-y:auto}
.maltesa-header-block{text-align:center;padding:20px 24px}
.maltesa-title{font-family:'Cinzel',serif;font-weight:900;font-size:20px;color:var(--cream);letter-spacing:5px}
.maltesa-subtitle{font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;font-size:13px;color:rgba(160,55,65,0.5);letter-spacing:1.5px;margin-top:6px}
.maltesa-latin{font-family:'Cormorant Garamond',serif;font-weight:600;font-style:italic;font-size:11px;color:var(--gold-dim);letter-spacing:2px;text-transform:uppercase;margin-top:10px}
.maltesa-divider{display:flex;align-items:center;gap:12px;padding:0 24px;margin:12px 0}
.maltesa-divider::before,.maltesa-divider::after{content:'';flex:1;height:1px;background:rgba(160,55,65,0.12)}
.article-block{background:rgba(160,55,65,0.03);border:1px solid rgba(160,55,65,0.08);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.article-num{font-family:'Cinzel',serif;font-weight:700;font-size:11px;color:rgba(160,55,65,0.6);letter-spacing:1px}
.article-title{font-family:'Cinzel',serif;font-weight:600;font-size:12px;color:var(--cream);letter-spacing:0.5px;margin:6px 0 8px}
.article-text{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:13px;color:rgba(255,255,255,0.35);line-height:1.55;margin-bottom:6px}
.article-text:last-child{margin-bottom:0}
.article-text .num{color:rgba(160,55,65,0.5);font-weight:600}
.article-text .term{color:var(--cream);font-weight:500}
.article-text .latin{color:var(--gold-dim);font-style:italic}
.article-text .opt{color:var(--gold-dim);font-weight:600}
.preamble-block{background:rgba(160,55,65,0.04);border:1px solid rgba(160,55,65,0.1);border-radius:10px;padding:16px;margin-bottom:12px}
.preamble-title{font-family:'Cinzel',serif;font-weight:700;font-size:11px;color:rgba(160,55,65,0.6);letter-spacing:1.5px;text-transform:uppercase;text-align:center;margin-bottom:8px}
.preamble-text{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:13px;color:rgba(255,255,255,0.35);line-height:1.55;text-align:justify}
.preamble-quote{font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;font-size:12px;color:rgba(184,134,11,0.35);line-height:1.5;text-align:center;margin-top:10px}
.values-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;padding:8px 12px;background:rgba(160,55,65,0.03);border:1px solid rgba(160,55,65,0.06);border-radius:8px;margin:6px 0}
.values-grid span{font-family:'Inter',sans-serif;font-weight:500;font-size:11px;color:var(--text-dimmer)}
.values-grid .right{text-align:right}
.values-grid .pos{color:var(--green)}
.values-grid .neg{color:var(--red)}
.infractions-grid{display:flex;flex-direction:column;gap:3px;padding:8px 10px;background:rgba(160,55,65,0.03);border:1px solid rgba(160,55,65,0.06);border-radius:8px;margin:6px 0}
.infraction-row{display:flex;justify-content:space-between;gap:8px}
.infraction-row .desc{font-family:'Inter',sans-serif;font-weight:400;font-size:10px;color:var(--text-dimmer);flex:1}
.infraction-row .pen{font-family:'Inter',sans-serif;font-weight:500;font-size:10px;color:rgba(220,80,80,0.5);white-space:nowrap}
.maltesa-seal{text-align:center;padding:20px 24px;margin-top:8px}
.seal-box{display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:12px 20px;background:rgba(160,55,65,0.04);border:1px solid rgba(160,55,65,0.1);border-radius:12px}
.seal-text{font-family:'Cinzel',serif;font-weight:900;font-size:12px;color:rgba(184,134,11,0.35);letter-spacing:3px}
.seal-edition{font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;font-size:10px;color:rgba(160,55,65,0.3);letter-spacing:1px}

/* Loading */
.loading{text-align:center;padding:40px;color:var(--text-dim);font-size:13px}
.empty-state{text-align:center;padding:40px 24px;color:var(--text-dimmer);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px}

/* Continue match banner */
.continue-banner{margin:0 32px 12px;padding:14px 16px;background:rgba(184,134,11,0.08);border:1px solid rgba(184,134,11,0.2);border-radius:12px;cursor:pointer;text-align:center;transition:background .2s}
.continue-banner:active{background:rgba(184,134,11,0.12)}
.continue-banner .cb-title{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;color:var(--gold);letter-spacing:0.5px}
.continue-banner .cb-sub{font-family:'Inter',sans-serif;font-size:10px;color:var(--text-dimmer);margin-top:2px}

/* Confirm modal */
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.confirm-overlay.active{display:flex}
</style>
</head>
<body>

<!-- ===== SCREENS ===== -->
<div id="app"></div>

<!-- Score Input Modal -->
<div class="modal-overlay" id="scoreModal">
  <div class="modal">
    <h3 id="modalPlayerName"></h3>
    <div class="modal-sub" id="modalRoundInfo"></div>
    <input type="number" id="modalInput" inputmode="numeric" placeholder="0" autocomplete="off">
    <div class="modal-btns">
      <button class="btn btn-outline btn-sm" onclick="closeScoreModal()">Cancelar</button>
      <button class="btn btn-gold btn-sm" onclick="saveScoreModal()">OK</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="confirm-overlay" id="confirmModal">
  <div class="modal">
    <h3 id="confirmTitle"></h3>
    <div class="modal-sub" id="confirmMsg" style="margin-bottom:0"></div>
    <div class="modal-btns" style="margin-top:16px">
      <button class="btn btn-outline btn-sm" onclick="closeConfirm()">Cancelar</button>
      <button class="btn btn-danger btn-sm" id="confirmBtn" onclick="">Confirmar</button>
    </div>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="nav-bar" id="navBar">
  <button class="nav-item active" onclick="navigate('menu')" data-nav="menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-8 9 8M5 10v9a1 1 0 001 1h3v-5h6v5h3a1 1 0 001-1v-9"/></svg>
    Inicio
  </button>
  <button class="nav-item" onclick="navigate('historico')" data-nav="historico">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Histórico
  </button>
  <button class="nav-item" onclick="navigate('hall')" data-nav="hall">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3 6h6l-5 4 2 7-6-4-6 4 2-7-5-4h6z"/></svg>
    Hall of Fame
  </button>
  <button class="nav-item" onclick="navigate('maltesa')" data-nav="maltesa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h12a2 2 0 012 2v14l-7-3-7 3V6a2 2 0 012-2z"/></svg>
    La Maltesa
  </button>
</nav>

<script>
// ===== SUPABASE INIT =====
const SUPABASE_URL = 'https://wndfzzubnxeulkffwfbv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InduZGZ6enVibnhldWxrZmZ3ZmJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NTM0MzUsImV4cCI6MjEwNjIyOTQzNX0.0t8XN22FbkDyU3BN7RmjXsfP3RTFmV0V81_xsO1TB9I';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== STATE =====
let state = {
  screen: 'menu',
  players: [],
  selectedPlayers: [],
  matchType: 'talmut',
  activeMatch: null,
  scores: {},       // { roundNum: { playerId: score } }
  currentRound: 1,
  totalRounds: 10,
  matches: [],
  hallSort: 'pt',
  unfinishedMatch: null
};

// ===== HELPERS =====
const $ = id => document.getElementById(id);
const app = () => $('app');
const abbr = name => name.substring(0, 3).toUpperCase();
function fmtDate(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
}

// ===== NAVIGATION =====
function navigate(screen) {
  state.screen = screen;
  render();
  window.scrollTo(0, 0);
}

function showNav(show) {
  $('navBar').style.display = show ? 'flex' : 'none';
}

function setActiveNav(name) {
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.nav === name);
  });
}

// ===== RENDER =====
function render() {
  switch (state.screen) {
    case 'menu': renderMenu(); showNav(true); setActiveNav('menu'); break;
    case 'select': renderSelect(); showNav(false); break;
    case 'score': renderScore(); showNav(false); break;
    case 'winner': renderWinner(); showNav(false); break;
    case 'historico': renderHistorico(); showNav(true); setActiveNav('historico'); break;
    case 'detail': renderDetail(); showNav(false); break;
    case 'hall': renderHall(); showNav(true); setActiveNav('hall'); break;
    case 'maltesa': renderMaltesa(); showNav(true); setActiveNav('maltesa'); break;
  }
}

// ===== MENU =====
function renderMenu() {
  let continueHtml = '';
  if (state.unfinishedMatch) {
    const m = state.unfinishedMatch;
    const typeLabel = m.match_type === 'talmut' ? 'TALMUT' : 'BLUE LAGOON';
    continueHtml = `<div class="continue-banner" onclick="continueMatch()">
      <div class="cb-title">▶ Continuar partida</div>
      <div class="cb-sub">${typeLabel} · Ronda ${m.currentRound}/${m.total_rounds}</div>
    </div>`;
  }
  app().innerHTML = `<div class="screen active" style="justify-content:center;padding-top:60px">
    <div style="text-align:center;padding:0 32px">
      <div style="font-size:48px;margin-bottom:8px">🃏</div>
      <div class="menu-title">TALMUT</div>
      <div class="menu-subtitle">Hic Ludus Errorem Punit</div>
    </div>
    <div class="menu-buttons" style="margin-top:40px">
      ${continueHtml}
      <button class="btn btn-gold" onclick="startMatch('talmut')">TALMUT</button>
      <button class="btn btn-blue" onclick="startMatch('blue_lagoon')">BLUE LAGOON</button>
    </div>
    <div class="menu-divider"><span>partida oficial · 10 rondas</span></div>
  </div>`;
}

// ===== PLAYER SELECTION =====
function startMatch(type) {
  state.matchType = type;
  state.selectedPlayers = [];
  state.screen = 'select';
  render();
}

function renderSelect() {
  const isBlue = state.matchType === 'blue_lagoon';
  const title = isBlue ? 'BLUE LAGOON' : 'TALMUT';
  const selClass = isBlue ? 'selected-blue' : 'selected';
  const btnClass = isBlue ? 'btn-blue' : 'btn-gold';
  const cards = state.players.map(p => {
    const sel = state.selectedPlayers.includes(p.id);
    return `<div class="player-card ${sel ? selClass : ''}" onclick="togglePlayer(${p.id})">
      <div class="check">${sel ? '<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>' : ''}</div>
      <div class="name">${p.name}</div>
    </div>`;
  }).join('');
  const canStart = state.selectedPlayers.length >= 2;
  app().innerHTML = `<div class="screen active no-nav">
    <div class="header">
      <button class="btn-back" onclick="navigate('menu')"><svg viewBox="0 0 8 14" fill="none"><polyline points="7,1 1,7 7,13" stroke="${isBlue ? 'var(--blue)' : 'var(--gold)'}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div style="flex:1;text-align:center"><h1 style="font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:var(--cream);letter-spacing:2px">${title}</h1>
      <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;color:var(--text-dim);margin-top:2px">Selección de jugadores</div></div>
      <div class="spacer"></div>
    </div>
    <div class="player-grid">${cards}</div>
    <div style="padding:16px 16px 24px"><button class="btn ${btnClass}" ${canStart ? '' : 'disabled'} onclick="createNewMatch()">EMPEZAR</button></div>
  </div>`;
}

function togglePlayer(id) {
  const idx = state.selectedPlayers.indexOf(id);
  if (idx >= 0) state.selectedPlayers.splice(idx, 1);
  else state.selectedPlayers.push(id);
  renderSelect();
}

// ===== CREATE MATCH =====
async function createNewMatch() {
  const totalRounds = state.matchType === 'talmut' ? 10 : 99;
  const { data: match, error } = await sb.from('matches').insert({ match_type: state.matchType, total_rounds: totalRounds }).select().single();
  if (error) { alert('Error: ' + error.message); return; }
  const mpRows = state.selectedPlayers.map(pid => ({ match_id: match.id, player_id: pid }));
  await sb.from('match_players').insert(mpRows);
  state.activeMatch = match;
  state.scores = {};
  state.currentRound = 1;
  state.totalRounds = totalRounds;
  state.screen = 'score';
  render();
}

// ===== CONTINUE MATCH =====
async function continueMatch() {
  const m = state.unfinishedMatch;
  state.activeMatch = m;
  state.matchType = m.match_type;
  state.totalRounds = m.total_rounds;
  state.selectedPlayers = m.playerIds;
  // Load existing scores
  const { data: rs } = await sb.from('round_scores').select('*').eq('match_id', m.id);
  state.scores = {};
  let maxRound = 0;
  (rs || []).forEach(r => {
    if (!state.scores[r.round_number]) state.scores[r.round_number] = {};
    state.scores[r.round_number][r.player_id] = r.score;
    if (r.round_number > maxRound) maxRound = r.round_number;
  });
  // Check if last round is complete
  const lastComplete = maxRound > 0 && state.selectedPlayers.every(pid => state.scores[maxRound]?.[pid] !== undefined);
  state.currentRound = lastComplete ? maxRound + 1 : (maxRound || 1);
  state.screen = 'score';
  render();
}

// ===== SCORE TABLE =====
function renderScore() {
  const isBlue = state.matchType === 'blue_lagoon';
  const title = isBlue ? 'BLUE LAGOON' : 'TALMUT';
  const accentColor = isBlue ? 'var(--blue)' : 'var(--gold)';
  const players = state.players.filter(p => state.selectedPlayers.includes(p.id));
  const maxRound = isBlue ? Math.max(state.currentRound, Object.keys(state.scores).length + 1) : state.totalRounds;
  const roundLabel = isBlue ? `Ronda ${state.currentRound}` : `Ronda ${state.currentRound}/${state.totalRounds}`;

  // Build table headers
  let ths = `<th>R</th>` + players.map(p => `<th>${abbr(p.name)}</th>`).join('');

  // Build rows
  let rows = '';
  for (let r = 1; r <= Math.max(state.currentRound, Object.keys(state.scores).length); r++) {
    let cells = `<td>${r}</td>`;
    players.forEach(p => {
      const val = state.scores[r]?.[p.id];
      if (val !== undefined) {
        let cls = '';
        if (val === 0) cls = 'zero';
        else if (val < 0) cls = 'negative';
        else if (val >= 40) cls = 'high';
        cells += `<td><div class="score-cell ${cls}" onclick="openScoreModal(${r},${p.id},'${p.name}')">${val}</div></td>`;
      } else if (r <= state.currentRound) {
        cells += `<td><div class="score-cell empty" onclick="openScoreModal(${r},${p.id},'${p.name}')">—</div></td>`;
      } else {
        cells += `<td><div class="score-cell empty">—</div></td>`;
      }
    });
    rows += `<tr>${cells}</tr>`;
  }

  // Totals
  let totals = `<td class="label">TOTAL</td>`;
  players.forEach(p => {
    let total = 0;
    Object.values(state.scores).forEach(rs => { if (rs[p.id] !== undefined) total += rs[p.id]; });
    totals += `<td style="color:${total <= 0 ? 'var(--green)' : 'var(--text)'}">${total}</td>`;
  });

  // Check if current round is complete
  const roundComplete = players.every(p => state.scores[state.currentRound]?.[p.id] !== undefined);

  // Determine if match can finish
  const canFinish = state.matchType === 'talmut' ? (state.currentRound > state.totalRounds || (state.currentRound === state.totalRounds && roundComplete)) : roundComplete;

  let actions = '';
  if (roundComplete && !(state.matchType === 'talmut' && state.currentRound >= state.totalRounds)) {
    actions += `<button class="btn ${isBlue ? 'btn-blue' : 'btn-gold'} btn-sm" onclick="nextRound()">SIGUIENTE RONDA</button>`;
  }
  if (isBlue && roundComplete) {
    actions += `<button class="btn btn-outline btn-sm" onclick="finishCurrentMatch()" style="margin-top:6px">ACABAR PARTIDA</button>`;
  }
  if (state.matchType === 'talmut' && state.currentRound >= state.totalRounds && roundComplete) {
    actions += `<button class="btn btn-gold btn-sm" onclick="finishCurrentMatch()">VER GANADOR</button>`;
  }

  app().innerHTML = `<div class="screen active no-nav">
    <div class="header">
      <button class="btn-back" onclick="confirmLeaveMatch()"><svg viewBox="0 0 8 14" fill="none"><polyline points="7,1 1,7 7,13" stroke="${accentColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div style="flex:1;text-align:center"><h1 style="font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:var(--cream);letter-spacing:2px">${title}</h1></div>
      <div class="spacer"></div>
    </div>
    <div class="round-info">${roundLabel}</div>
    <div class="score-wrapper">
      <table class="score-table">
        <thead><tr>${ths}</tr></thead>
        <tbody>${rows}<tr class="total-row">${totals}</tr></tbody>
      </table>
    </div>
    <div class="score-actions" style="flex-direction:column">${actions}</div>
  </div>`;
}

function confirmLeaveMatch() {
  showConfirm('¿Salir de la partida?', 'La partida quedará guardada y podrás continuarla después.', () => {
    checkUnfinished().then(() => navigate('menu'));
  });
}

function nextRound() {
  state.currentRound++;
  renderScore();
}

// ===== SCORE MODAL =====
let modalRound = 0, modalPlayerId = 0;
function openScoreModal(round, playerId, playerName) {
  modalRound = round;
  modalPlayerId = playerId;
  $('modalPlayerName').textContent = playerName;
  $('modalRoundInfo').textContent = `Ronda ${round}`;
  const existing = state.scores[round]?.[playerId];
  $('modalInput').value = existing !== undefined ? existing : '';
  $('scoreModal').classList.add('active');
  setTimeout(() => $('modalInput').focus(), 100);
}

function closeScoreModal() {
  $('scoreModal').classList.remove('active');
}

async function saveScoreModal() {
  const val = parseInt($('modalInput').value);
  if (isNaN(val)) return;
  if (!state.scores[modalRound]) state.scores[modalRound] = {};
  state.scores[modalRound][modalPlayerId] = val;
  // Save to Supabase
  const { error } = await sb.from('round_scores').upsert({
    match_id: state.activeMatch.id,
    round_number: modalRound,
    player_id: modalPlayerId,
    score: val,
    is_winner: val === 0 || val < 0
  }, { onConflict: 'match_id,round_number,player_id' });
  if (error) console.error('Save error:', error);
  closeScoreModal();
  renderScore();
}

$('modalInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveScoreModal(); });

// ===== FINISH MATCH =====
async function finishCurrentMatch() {
  // Update actual round count for Blue Lagoon
  const actualRounds = Object.keys(state.scores).length;
  await sb.from('matches').update({
    is_finished: true,
    finished_at: new Date().toISOString(),
    total_rounds: actualRounds
  }).eq('id', state.activeMatch.id);
  state.unfinishedMatch = null;
  state.screen = 'winner';
  render();
}

// ===== WINNER =====
function renderWinner() {
  const players = state.players.filter(p => state.selectedPlayers.includes(p.id));
  const isBlue = state.matchType === 'blue_lagoon';
  const accentColor = isBlue ? 'var(--blue)' : 'var(--gold)';

  // Calculate totals
  const totals = players.map(p => {
    let total = 0;
    Object.values(state.scores).forEach(rs => { if (rs[p.id] !== undefined) total += rs[p.id]; });
    return { ...p, total };
  }).sort((a, b) => a.total - b.total);

  const winner = totals[0];
  const standings = totals.map((p, i) => {
    const color = i === 0 ? 'var(--green)' : (i === totals.length - 1 ? 'var(--red)' : 'var(--text-dim)');
    return `<div class="standing-row">
      <div class="standing-pos">#${i + 1}</div>
      <div class="standing-name">${p.name}</div>
      <div class="standing-pts" style="color:${color}">${p.total} pts</div>
    </div>`;
  }).join('');

  app().innerHTML = `<div class="screen active no-nav">
    <div class="winner-screen">
      <div class="winner-crown">👑</div>
      <div class="winner-name" style="color:${accentColor}">${winner.name}</div>
      <div class="winner-score">${winner.total} puntos · ${isBlue ? 'Blue Lagoon' : 'TALMUT'}</div>
      <div class="standings">${standings}</div>
      <div style="width:100%;margin-top:24px">
        <button class="btn ${isBlue ? 'btn-blue' : 'btn-gold'}" onclick="checkUnfinished().then(()=>navigate('menu'))">VOLVER AL MENÚ</button>
      </div>
    </div>
  </div>`;
}

// ===== HISTÓRICO =====
async function loadHistorico() {
  // Load finished matches with their scores
  const { data: matches } = await sb.from('matches').select('*, match_players(player_id), round_scores(player_id, score, round_number)').eq('is_finished', true).order('finished_at', { ascending: false });
  state.matches = (matches || []).map(m => {
    const playerIds = m.match_players.map(mp => mp.player_id);
    const playerTotals = {};
    playerIds.forEach(pid => { playerTotals[pid] = 0; });
    m.round_scores.forEach(rs => { playerTotals[rs.player_id] = (playerTotals[rs.player_id] || 0) + rs.score; });
    const sorted = Object.entries(playerTotals).sort((a, b) => a[1] - b[1]);
    const winnerId = sorted.length > 0 ? parseInt(sorted[0][0]) : null;
    return { ...m, playerIds, playerTotals, winnerId };
  });
}

async function renderHistorico() {
  app().innerHTML = `<div class="screen active"><div class="header"><div style="flex:1;text-align:center"><h1 style="font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:var(--cream);letter-spacing:2px">HISTÓRICO</h1></div></div><div class="loading">Cargando...</div></div>`;
  await loadHistorico();

  const talmutCount = state.matches.filter(m => m.match_type === 'talmut').length;
  const blCount = state.matches.filter(m => m.match_type === 'blue_lagoon').length;

  // Per-player wins (TALMUT only)
  const winCounts = {};
  state.players.forEach(p => { winCounts[p.id] = 0; });
  state.matches.filter(m => m.match_type === 'talmut').forEach(m => {
    if (m.winnerId) winCounts[m.winnerId] = (winCounts[m.winnerId] || 0) + 1;
  });

  const matchItems = state.matches.map(m => {
    const winner = state.players.find(p => p.id === m.winnerId);
    const playerNames = m.playerIds.map(pid => state.players.find(p => p.id === pid)?.name).filter(Boolean).join(', ');
    return `<div class="match-item" onclick="showMatchDetail(${m.id})">
      <div class="match-header">
        <span class="match-type ${m.match_type}">${m.match_type === 'talmut' ? 'TALMUT' : 'BLUE LAGOON'}</span>
        <span class="match-date">${fmtDate(m.finished_at || m.created_at)}</span>
      </div>
      <div class="match-winner">🏆 ${winner?.name || '—'}</div>
      <div class="match-players">${playerNames}</div>
    </div>`;
  }).join('');

  app().innerHTML = `<div class="screen active">
    <div class="header"><div style="flex:1;text-align:center"><h1 style="font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:var(--cream);letter-spacing:2px">HISTÓRICO</h1></div></div>
    <div class="historico-summary">
      <div class="summary-card"><div class="value">${talmutCount}</div><div class="label">PARTIDAS TALMUT</div></div>
      <div class="summary-card"><div class="value" style="color:var(--blue)">${blCount}</div><div class="label">BLUE LAGOON</div></div>
    </div>
    ${state.matches.length === 0 ? '<div class="empty-state">Aún no hay partidas registradas</div>' : `<div class="match-list">${matchItems}</div>`}
  </div>`;
}

// ===== MATCH DETAIL =====
async function showMatchDetail(matchId) {
  state.detailMatch = state.matches.find(m => m.id === matchId);
  state.screen = 'detail';
  render();
}

function renderDetail() {
  const m = state.detailMatch;
  if (!m) return navigate('historico');
  const players = state.players.filter(p => m.playerIds.includes(p.id));
  const isBlue = m.match_type === 'blue_lagoon';
  const accentColor = isBlue ? 'var(--blue)' : 'var(--gold)';

  // Group scores by round
  const rounds = {};
  m.round_scores.forEach(rs => {
    if (!rounds[rs.round_number]) rounds[rs.round_number] = {};
    rounds[rs.round_number][rs.player_id] = rs.score;
  });
  const numRounds = Math.max(...Object.keys(rounds).map(Number), 0);

  let ths = `<th>R</th>` + players.map(p => `<th>${abbr(p.name)}</th>`).join('');
  let rows = '';
  for (let r = 1; r <= numRounds; r++) {
    let cells = `<td>${r}</td>`;
    players.forEach(p => {
      const val = rounds[r]?.[p.id] ?? '—';
      let cls = '';
      if (val === 0) cls = 'zero';
      else if (val < 0) cls = 'negative';
      else if (val >= 40) cls = 'high';
      cells += `<td><div class="score-cell ${cls}" style="cursor:default">${val}</div></td>`;
    });
    rows += `<tr>${cells}</tr>`;
  }
  let totals = `<td class="label">TOTAL</td>`;
  players.forEach(p => {
    const t = m.playerTotals[p.id] || 0;
    totals += `<td style="color:${t <= 0 ? 'var(--green)' : 'var(--text)'}; font-weight:700">${t}</td>`;
  });

  const winner = state.players.find(p => p.id === m.winnerId);
  app().innerHTML = `<div class="screen active no-nav">
    <div class="header">
      <button class="btn-back" onclick="navigate('historico')"><svg viewBox="0 0 8 14" fill="none"><polyline points="7,1 1,7 7,13" stroke="${accentColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div style="flex:1;text-align:center"><h1 style="font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:var(--cream);letter-spacing:2px">${isBlue ? 'BLUE LAGOON' : 'TALMUT'}</h1>
      <div style="font-family:'Inter',sans-serif;font-size:10px;color:var(--text-dimmer);margin-top:2px">${fmtDate(m.finished_at || m.created_at)} · 🏆 ${winner?.name || '—'}</div></div>
      <div class="spacer"></div>
    </div>
    <div class="score-wrapper">
      <table class="score-table"><thead><tr>${ths}</tr></thead><tbody>${rows}<tr class="total-row">${totals}</tr></tbody></table>
    </div>
    <div style="padding:16px">
      <button class="btn btn-danger btn-sm" onclick="confirmDeleteMatch(${m.id})">Eliminar partida</button>
    </div>
  </div>`;
}

function confirmDeleteMatch(id) {
  showConfirm('¿Eliminar partida?', 'Esta acción no se puede deshacer.', async () => {
    await sb.from('matches').delete().eq('id', id);
    navigate('historico');
  });
}

// ===== HALL OF FAME =====
async function renderHall() {
  app().innerHTML = `<div class="screen active"><div class="header"><div style="flex:1;text-align:center"><h1 style="font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:var(--cream);letter-spacing:2px">HALL OF FAME</h1></div></div><div class="loading">Cargando...</div></div>`;

  // Load all finished TALMUT matches with scores
  const { data: matches } = await sb.from('matches').select('id, match_players(player_id), round_scores(player_id, score)').eq('is_finished', true).eq('match_type', 'talmut');

  const stats = state.players.map(p => {
    let pj = 0, totalPts = 0, wins = 0, best = null, scores = [];
    (matches || []).forEach(m => {
      const inMatch = m.match_players.some(mp => mp.player_id === p.id);
      if (!inMatch) return;
      pj++;
      let matchTotal = 0;
      m.round_scores.filter(rs => rs.player_id === p.id).forEach(rs => { matchTotal += rs.score; });
      totalPts += matchTotal;
      scores.push(matchTotal);
      // Check if winner (lowest total)
      const playerTotals = {};
      m.match_players.forEach(mp => { playerTotals[mp.player_id] = 0; });
      m.round_scores.forEach(rs => { playerTotals[rs.player_id] = (playerTotals[rs.player_id] || 0) + rs.score; });
      const minTotal = Math.min(...Object.values(playerTotals));
      if (matchTotal === minTotal) wins++;
      if (best === null || matchTotal < best) best = matchTotal;
    });
    const avg = pj > 0 ? (totalPts / pj).toFixed(1) : '—';
    const winPct = pj > 0 ? Math.round((wins / pj) * 100) : 0;
    return { id: p.id, name: p.name, pj, pt: totalPts, w: wins, winPct, best: best ?? '—', avg };
  });

  // Sort
  if (state.hallSort === 'pt') stats.sort((a, b) => a.pt - b.pt);
  else stats.sort((a, b) => b.w - a.w || a.pt - b.pt);

  const rows = stats.map(s => `<tr>
    <td>${s.name}</td>
    <td>${s.pj}</td>
    <td class="highlight">${s.pt}</td>
    <td>${s.w}</td>
    <td>${s.winPct}%</td>
    <td style="color:var(--green)">${s.best}</td>
    <td>${s.avg}</td>
  </tr>`).join('');

  app().innerHTML = `<div class="screen active">
    <div class="header"><div style="flex:1;text-align:center"><h1 style="font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:var(--cream);letter-spacing:2px">HALL OF FAME</h1></div></div>
    <div class="hall-sort">
      <button class="sort-btn ${state.hallSort === 'pt' ? 'active' : ''}" onclick="state.hallSort='pt';renderHall()">Puntos Totales</button>
      <button class="sort-btn ${state.hallSort === 'w' ? 'active' : ''}" onclick="state.hallSort='w';renderHall()">Victorias</button>
    </div>
    <div style="overflow-x:auto;padding:0 8px">
      <table class="hall-table">
        <thead><tr><th>Jugador</th><th>PJ</th><th>PT</th><th>W</th><th>W%</th><th>Mejor</th><th>Media</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${stats.every(s => s.pj === 0) ? '<div class="empty-state">Aún no hay estadísticas</div>' : ''}
  </div>`;
}

// ===== LA MALTESA =====

    <div class="header" style="background:transparent">
      <div style="flex:1;text-align:center"><h1 style="font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:var(--cream);letter-spacing:2px">LA MALTESA</h1>
      <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;color:rgba(160,55,65,0.5);margin-top:2px">Constitución oficial</div></div>
    </div>
    <div class="maltesa-header-block">

      <div class="maltesa-latin">Hic Ludus Errorem Punit</div>
    </div>
    <div class="maltesa-divider"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1l1.5 3 3.5 0.5-2.5 2.5 0.5 3.5L7 9l-3 1.5 0.5-3.5L2 4.5 5.5 4z" fill="rgba(160,55,65,0.25)"/></svg></div>
    <div class="maltesa-content">
      <div class="preamble-block">
        <div class="preamble-title">Preámbulo</div>
        <p class="preamble-text">El presente documento constituye la norma suprema e irrefutable que rige el juego conocido como TALMUT. Nace de la necesidad histórica de codificar las reglas, tradiciones, leyes y sanciones que han surgido de forma orgánica a lo largo de incontables partidas.</p>
        <p class="preamble-quote">«Ningún jugador, independientemente de su antigüedad, su racha de victorias o su vehemencia a la hora de argumentar, podrá invocar norma alguna que no esté contemplada en La Maltesa.»</p>
        <p class="preamble-text" style="margin-top:8px">El documento podrá ampliarse mediante consenso unánime de los jugadores habituales, según lo dispuesto en el Artículo 9.</p>
      </div>

      <div class="article-block">
        <div class="article-num">ARTÍCULO 1</div>
        <div class="article-title">Del Juramento Fundacional</div>
        <p class="article-text"><span class="num">1.1</span> · Antes de cualquier partida, todos los jugadores deberán reunirse y prestar el juramento fundacional.</p>
        <p class="article-text"><span class="num">1.2</span> · Cada jugador extenderá una mano al centro de la mesa. Las manos se apilarán como símbolo de pacto colectivo. Todos pronunciarán al unísono: <span class="latin">«HIC LUDUS ERROREM PUNIT»</span> — «Este juego castiga el error».</p>
        <p class="article-text"><span class="num">1.3</span> · El jugador que rehúse participar, pronuncie el juramento de forma inaudible o se mofe del acto recibirá una carta de penalización antes de comenzar a jugar.</p>
      </div>

      <div class="article-block">
        <div class="article-num">ARTÍCULO 2</div>
        <div class="article-title">Del Orden de Juego</div>
        <p class="article-text"><span class="num">2.1</span> · El jugador que abre la primera ronda se determinará mediante un aleatorizador de dispositivo móvil.</p>
        <p class="article-text"><span class="num">2.2</span> · Alternativamente, se repartirá una carta boca abajo a cada jugador. La carta más alta determina quién abre.</p>
        <p class="article-text"><span class="num">2.3</span> · A partir de la segunda ronda, abre el ganador de la ronda anterior.</p>
        <p class="article-text"><span class="num">2.4</span> · El orden de turno sigue la rotación en sentido horario desde el jugador que abre.</p>
        <p class="article-text"><span class="num">2.5</span> · El jugador con la puntuación más alta de la ronda anterior baraja y reparte.</p>
      </div>

      <div class="article-block">
        <div class="article-num">ARTÍCULO 3</div>
        <div class="article-title">Del Reparto y la Observación Inicial</div>
        <p class="article-text"><span class="num">3.1</span> · El repartidor baraja la baraja completa. Otro jugador la corta. Se reparten cuatro cartas boca abajo a cada jugador.</p>
        <p class="article-text"><span class="num">3.2</span> · Los jugadores colocan sus cartas según su preferencia personal antes de la observación inicial.</p>
        <p class="article-text"><span class="num">3.3</span> · Tras una cuenta atrás colectiva (<span class="latin">«3… 2… 1…»</span>), cada jugador levanta simultáneamente dos de sus cuatro cartas para observarlas. Tiempo máximo: dos segundos.</p>
        <p class="article-text"><span class="num">3.4</span> · Queda estrictamente prohibido volver a mirar las cartas propias salvo que una carta especial lo permita. Infracción: una carta de penalización.</p>
      </div>

      <div class="article-block">
        <div class="article-num">ARTÍCULO 4</div>
        <div class="article-title">Del Turno de Juego</div>
        <p class="article-text"><span class="num">4.1</span> · El jugador activo roba la carta superior del mazo y elige:</p>
        <p class="article-text" style="padding-left:12px"><span class="opt">Opción A:</span> Quedarse la carta robada, descartando una de sus cuatro cartas boca abajo.</p>
        <p class="article-text" style="padding-left:12px"><span class="opt">Opción B:</span> Rechazar la carta robada, colocándola boca arriba en el montón de descarte.</p>
        <p class="article-text"><span class="num">4.2</span> · <span class="term">El Descarte Cruzado:</span> Cuando se descarta una carta, cualquier jugador que posea cartas del mismo valor podrá descartarlas inmediatamente. <span class="latin">«La velocidad es ley»</span> cuando se producen descartes simultáneos.</p>
        <p class="article-text"><span class="num">4.3</span> · Ejecutar un Descarte Cruzado con cartas de valor no coincidente acarrea una carta de penalización.</p>
        <p class="article-text"><span class="num">4.4</span> · <span class="term">La Ley de la Tortilla:</span> Cuando un jugador roba una carta que coincide con una propia y ejecuta un Descarte Cruzado contra sí mismo, deberá manipular ambas cartas con la misma mano en un movimiento continuo. Usar manos diferentes: penalización.</p>
      </div>

      <div class="article-block">
        <div class="article-num">ARTÍCULO 5</div>
        <div class="article-title">De las Cartas Especiales</div>
        <p class="article-text"><span class="num">5.1</span> · Las cartas especiales se activan únicamente cuando se descartan directamente del robo, boca arriba. Incorporarlas a la mano anula sus efectos.</p>
        <p class="article-text"><span class="num">5.2</span> · <span class="term">El DIEZ (10):</span> Mirar en secreto una carta propia boca abajo.</p>
        <p class="article-text"><span class="num">5.3</span> · <span class="term">La JOTA (J):</span> Mirar en secreto una carta de un oponente. Tradición: pronunciar <span class="latin">«a…JJJJJ…jena»</span>.</p>
        <p class="article-text"><span class="num">5.4</span> · <span class="term">La REINA (Q):</span> Dos modos de intercambio ciego:</p>
        <p class="article-text" style="padding-left:12px"><span class="opt">Modo 1:</span> Intercambiar una carta propia por una de un oponente, sin ver ninguna.</p>
        <p class="article-text" style="padding-left:12px"><span class="opt">Modo 2:</span> Intercambiar una carta de un jugador por la de otro jugador distinto.</p>
        <p class="article-text"><span class="num">5.5</span> · <span class="term">El REY (K):</span> Dos modos:</p>
        <p class="article-text" style="padding-left:12px"><span class="opt">Modo 1:</span> Mirar una carta de un oponente e intercambiarla por una propia si lo desea.</p>
        <p class="article-text" style="padding-left:12px"><span class="opt">Modo 2:</span> Mirar una carta de un oponente y transferirla a un tercer jugador.</p>
        <p class="article-text"><span class="num">5.6</span> · <span class="term">El JOKER:</span> Si el portador gana la ronda: <span style="color:var(--green);font-weight:600">−1 punto</span>. Si no gana: <span style="color:var(--red);font-weight:600">+50 puntos</span>.</p>
        <p class="article-text"><span class="num">5.7</span> · <span class="term">Excepción del Joker ganador:</span> El ganador con JOKER puntúa −1, no cero.</p>
      </div>

      <div class="article-block">
        <div class="article-num">ARTÍCULO 6</div>
        <div class="article-title">Del Talmut</div>
        <p class="article-text"><span class="num">6.1</span> · Un jugador declarará TALMUT cuando crea que la suma de sus cuatro cartas es igual o inferior a cinco puntos.</p>
        <p class="article-text"><span class="num">6.2</span> · La declaración es voluntaria.</p>
        <p class="article-text"><span class="num">6.3</span> · Tras la declaración, cada jugador restante dispone de exactamente un turno adicional.</p>
        <p class="article-text"><span class="num">6.4</span> · El declarante conserva sus derechos de Descarte Cruzado durante el turno final.</p>
        <p class="article-text"><span class="num">6.5</span> · <span class="term">El TALMUT erróneo:</span> Si la suma supera los cinco puntos, el declarante acumulará la suma de puntos de todos los demás jugadores.</p>
        <p class="article-text"><span class="num">6.6</span> · <span class="term">El TALMUT automático:</span> Si un jugador descarta su última carta boca abajo, el TALMUT se declara automáticamente.</p>
        <p class="article-text"><span class="num">6.7</span> · <span class="term">El Intocable de Elliot Ness:</span> El declarante obtiene inmunidad completa. Ninguna carta especial podrá dirigirse a él.</p>
      </div>

      <div class="article-block">
        <div class="article-num">ARTÍCULO 7</div>
        <div class="article-title">De la Puntuación</div>
        <p class="article-text"><span class="num">7.1</span> · Valores de las cartas:</p>
        <div class="values-grid">
          <span>A</span><span class="right">1 punto</span>
          <span>2 – 10</span><span class="right">Valor facial</span>
          <span>J</span><span class="right">20 puntos</span>
          <span>Q</span><span class="right">30 puntos</span>
          <span>K</span><span class="right">40 puntos</span>
          <span class="pos">JOKER (ganador)</span><span class="right pos">−1 punto</span>
          <span class="neg">JOKER (no ganador)</span><span class="right neg">+50 puntos</span>
        </div>
        <p class="article-text"><span class="num">7.2</span> · El jugador con la puntuación más baja gana la ronda y puntúa cero (excepto Art. 5.7).</p>
        <p class="article-text"><span class="num">7.3</span> · En caso de empate con el declarante de TALMUT, gana el no declarante.</p>
        <p class="article-text"><span class="num">7.4</span> · Una partida consta de diez rondas. Partidas incompletas se denominan <span style="color:var(--blue);font-weight:500">«Blue Lagoon»</span>. <span class="latin">«El Blue Lagoon no existe para la historia. Solo para el ganador.»</span></p>
      </div>

      <div class="article-block">
        <div class="article-num">ARTÍCULO 8</div>
        <div class="article-title">De las Penalizaciones</div>
        <p class="article-text"><span class="num">8.1</span> · Penalización estándar: una carta adicional del mazo que el infractor no puede ver.</p>
        <p class="article-text"><span class="num">8.2</span> · Tabla de infracciones:</p>
        <div class="infractions-grid">
          <div class="infraction-row"><span class="desc">Juramento irrespetuoso / inaudible</span><span class="pen">1 carta</span></div>
          <div class="infraction-row"><span class="desc">Mirar carta propia sin permiso</span><span class="pen">1 carta</span></div>
          <div class="infraction-row"><span class="desc">Violación Ley de la Tortilla</span><span class="pen">1 carta</span></div>
          <div class="infraction-row"><span class="desc">Descarte Cruzado incorrecto</span><span class="pen">1 carta</span></div>
          <div class="infraction-row"><span class="desc">Robar carta fuera de turno</span><span class="pen">1 carta</span></div>
          <div class="infraction-row"><span class="desc">TALMUT erróneo (más de 5 pts)</span><span class="pen">Suma de todos</span></div>
        </div>
      </div>

      <div class="article-block">
        <div class="article-num">ARTÍCULO 9</div>
        <div class="article-title">De las Enmiendas</div>
        <p class="article-text"><span class="num">9.1</span> · La Maltesa es un documento vivo. Las leyes acordadas se añadirán como enmiendas numeradas.</p>
        <p class="article-text"><span class="num">9.2</span> · Cada enmienda requiere: número, fecha, descripción clara y firmas de todos los jugadores presentes.</p>
        <p class="article-text"><span class="num">9.3</span> · Las disputas no contempladas se resolverán por votación. En caso de empate, prevalecerá <span class="latin">«la interpretación más perjudicial para el jugador que haya cometido el error»</span>.</p>
      </div>

      <div style="text-align:center;padding:16px 8px">
        <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:rgba(255,255,255,0.2);line-height:1.6">«El presente documento ha sido redactado con plena autoridad y rigor para que jamás pueda alegarse ignorancia ante el error cometido en la mesa.»</p>
      </div>

      <div class="maltesa-seal">
        <div class="seal-box">
          <div class="seal-text">HIC LUDUS ERROREM PUNIT</div>
          <div class="seal-edition">Primera edición · MMXXIV</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ===== CONFIRM MODAL =====
let confirmCallback = null;
function showConfirm(title, msg, cb) {
  $('confirmTitle').textContent = title;
  $('confirmMsg').textContent = msg;
  confirmCallback = cb;
  $('confirmBtn').onclick = () => { closeConfirm(); if (confirmCallback) confirmCallback(); };
  $('confirmModal').classList.add('active');
}
function closeConfirm() { $('confirmModal').classList.remove('active'); }

// ===== CHECK UNFINISHED =====
async function checkUnfinished() {
  const { data } = await sb.from('matches').select('*, match_players(player_id), round_scores(round_number)').eq('is_finished', false).order('created_at', { ascending: false }).limit(1);
  if (data && data.length > 0) {
    const m = data[0];
    const playerIds = m.match_players.map(mp => mp.player_id);
    const roundNums = [...new Set(m.round_scores.map(rs => rs.round_number))];
    const currentRound = roundNums.length > 0 ? Math.max(...roundNums) + 1 : 1;
    state.unfinishedMatch = { ...m, playerIds, currentRound };
  } else {
    state.unfinishedMatch = null;
  }
}

// ===== INIT =====
async function init() {
  const { data: players } = await sb.from('players').select('*').order('id');
  state.players = players || [];
  await checkUnfinished();
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
